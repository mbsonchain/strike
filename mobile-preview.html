<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Strikeout — mobile preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #e7e7e5; font: 12px Arial, sans-serif; color: #333; }
    main { width: min(390px, 100%); margin: 24px auto; }
    nav { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin: 0 0 14px; padding: 0 6px; }
    a { color: inherit; }
    iframe { display: block; width: 100%; height: 844px; border: 0; background: #769abe; box-shadow: 0 0 0 1px #0002; }
    @media (max-width: 430px) { main { margin: 0 auto; } nav { padding: 12px; margin: 0; } iframe { height: calc(100svh - 40px); } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Preview"><span>STRIKEOUT · MOBILE</span><a href="/#video">Open full site ↗</a></nav>
    <iframe src="/#video" title="Strikeout mobile layout" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
</body>
</html>
