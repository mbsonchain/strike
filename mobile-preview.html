<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Strikeout — mobile preview</title>
  <meta name="theme-color" content="#769abe">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { display: grid; place-items: center; }
    main { width: min(390px, 100%); height: min(844px, 100svh); height: min(844px, 100dvh); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
    @media (max-width: 760px) { main { width: 100%; height: 100svh; height: 100dvh; } }
  </style>
</head>
<body>
  <main aria-label="Strikeout mobile preview">
    <iframe src="/#video" title="Strikeout mobile layout" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
</body>
</html>
