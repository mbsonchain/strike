<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Strikeout — 390 × 844 mobile preview</title>
  <link rel="icon" href="/assets/strikeout-s.png">
  <style>
    html { min-height: 100%; background: #769abe url('/assets/strikeout-sky.jpg') center / cover no-repeat; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
    iframe { display: block; width: 390px; height: 844px; max-width: 100vw; border: 0; }
  </style>
</head>
<body>
  <script>
    // Phones open the actual site. Wider screens preview that same site at phone size.
    if (matchMedia('(max-width: 760px)').matches) {
      location.replace('/#video');
    } else {
      const frame = document.createElement('iframe');
      frame.title = 'Strikeout at 390 by 844 pixels';
      frame.allow = 'autoplay; fullscreen';
      frame.src = '/#video';
      document.body.append(frame);
    }
  </script>
  <noscript><a href="/#video">Open Strikeout</a></noscript>
</body>
</html>
